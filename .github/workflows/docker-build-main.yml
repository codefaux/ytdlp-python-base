name: Build and Push Docker Image (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build-main.yml'
  schedule:
    - cron: "0 * * * *"  # check every hour

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest yt-dlp release
        id: yt_dlp
        run: |
          LATEST=$(curl -s https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | jq -r .tag_name)
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Restore previous version
        id: cache
        uses: actions/cache@v4
        with:
          path: .yt_dlp_version
          key: yt-dlp-version-cache

      - name: Read previous version
        id: previous
        run: |
          if [ -f .yt_dlp_version ]; then
            echo "prev=$(cat .yt_dlp_version)" >> $GITHUB_OUTPUT
          else
            echo "prev=none" >> $GITHUB_OUTPUT
          fi

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.previous.outputs.prev }}" != "${{ steps.yt_dlp.outputs.latest }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save new version
        if: steps.compare.outputs.changed == 'true'
        run: echo "${{ steps.yt_dlp.outputs.latest }}" > .yt_dlp_version

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build version
        if: steps.compare.outputs.changed == 'true'
        run: echo "BUILD_TAG=${{ steps.yt_dlp.outputs.latest }}" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
